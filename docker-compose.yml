version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: docker-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgresql_db
      POSTGRES_PASSWORD: fintrack1234
      POSTGRES_DB: fintrackdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: